<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niconico check</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #0A0B0B; color: #E8EDEC; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 22px; }
  button { justify-self: start; padding: 12px 22px; border: 0; border-radius: 999px; background: #39C5BB; color: #042220; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }
  pre { margin: 0; white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; color: #8A9491; max-height: 260px; overflow: auto; }
  #summary { font-weight: 600; font-size: 17px; }
  .ok { color: #39C5BB; } .bad { color: #F06A6A; }
</style>
</head>
<body>
<main>
  <h1>Niconico check for Miku in 0.1</h1>
  <p>Click the button. Senbonzakura should start playing in the box below for about 2 seconds, then pause.</p>
  <button id="go">Run the check</button>
  <p id="summary"></p>
  <iframe id="nico" allow="autoplay; fullscreen" src="https://embed.nicovideo.jp/watch/sm15630734?jsapi=1&playerId=1"></iframe>
  <pre id="log"></pre>
</main>
<script>
const frame = document.getElementById("nico");
const logEl = document.getElementById("log");
const ORIGIN = "https://embed.nicovideo.jp";
const log = (m) => { logEl.textContent += m + "\n"; };
const state = { ready: false, status: null, time: null, events: 0 };
window.addEventListener("message", (e) => {
  if (e.origin !== ORIGIN) return;
  const d = e.data || {};
  state.events++;
  if (d.eventName === "loadComplete") { state.ready = true; log("loaded: " + (d.data?.videoInfo?.title || "")); }
  else if (d.eventName === "playerStatusChange") { state.status = d.data?.playerStatus; log("status " + state.status); }
  else if (d.eventName === "playerMetadataChange") { state.time = d.data?.currentTime; }
  else if (d.eventName === "error") { log("ERROR " + JSON.stringify(d.data)); }
  else if (d.eventName !== "playerMetadataChange") { log(d.eventName); }
});
const send = (eventName, data) => frame.contentWindow.postMessage(Object.assign({ eventName, playerId: "1", sourceConnectorType: 1 }, data ? { data } : {}), ORIGIN);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById("go").addEventListener("click", async () => {
  log("ready=" + state.ready + " events=" + state.events);
  send("seek", { time: 0 });
  send("play");
  await sleep(2000);
  send("pause");
  await sleep(800);
  const ok = state.time != null && state.time > 300;
  document.getElementById("summary").innerHTML = ok
    ? `<span class="ok">Niconico works here (played to ${(state.time / 1000).toFixed(2)}s).</span> Send Claude a screenshot.`
    : `<span class="bad">Niconico didn't play (status ${state.status}, time ${state.time}).</span> Send Claude a screenshot.`;
});
</script>
</body>
</html>
